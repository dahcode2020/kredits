# CI slice 1 — les six gardes et les tests, lancés par GitHub Actions à chaque poussée.
#
# « Ils ne valent que si quelqu'un — ou GitHub Actions — les lance. » (brief de reprise, §5)
#
# Actif depuis .github/workflows/ci.yml : la permission `workflows` a été accordée
# au compte connecté le 2026-09-13, le fichier est donc poussé à son emplacement réel.
# (Dans l'ancien dépôt, la même absence de permission avait produit un ci.example.yml
# inerte dans docs/ ; ici la CI tourne à chaque poussée sans manipulation.)
#
# Quatre jobs en chaîne:
#   1. gardes  : lint, typecheck, puis les gardes statiques (hydration + dom-nesting, copy, routes);
#   2. unit    : les verrous jest (parité i18n, clés utilisées, hydratation/Intl, motion, grille);
#   3. build   : next build;
#   4. assets  : serveur de production lancé, puis check:assets sur les 4 locales et check:state —
#                le contrôle qui tranche entre « terminal vert » et « page blanche ».
name: CI

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]

jobs:
  gardes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run check        # typecheck + check:hydration + check:copy + check:links

  unit:
    runs-on: ubuntu-latest
    needs: gardes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run test:unit -- --ci

  build:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build

  assets:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      # Le serveur de production sert ce qui vient d'être compilé; les gardes interrogent le HTML
      # exactement comme le ferait un navigateur (et exigent chaque ressource référencée).
      - name: next start (fond)
        run: |
          (cd frontend && nohup npm run start > /tmp/next-start.log 2>&1 & echo $! > /tmp/next.pid)
          for i in $(seq 1 60); do curl -sf http://localhost:3000/fr > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/fr > /dev/null
      - run: npm --prefix frontend run check:assets
      - run: node frontend/scripts/check-state.mjs
      - if: always()
        run: kill $(cat /tmp/next.pid) 2>/dev/null || true
